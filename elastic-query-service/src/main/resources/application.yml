spring:
  application:
    name: elastic-query-service
  profiles:
    active: elastic_query
  cloud:
    config:
      name: elastic-query-service,config-client
      username: spring_cloud_user
      password: springCloud_Pwd!
  security:
    logging:
      level:
        org:
          keycloak: DEBUG

    oauth2:
      logging:
        level:
          org:
            springframework:
              security: DEBUG
            OAuth2: DEBUG
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/microservices_realm
          jwk-set-uri: http://localhost:8081/auth/realms/microservices_realm/protocol/openid-connect/certs
